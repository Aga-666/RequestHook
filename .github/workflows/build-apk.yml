name: Build RequestHook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q *.zip -d project
          cd project
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "project/$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RequestHook-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
